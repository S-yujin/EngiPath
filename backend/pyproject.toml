[project]
name = "onetool-backend"
version = "0.1.0"
description = "OneTool / EngiPath backend — AI-assisted career reflection companion"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "python-dotenv>=1.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "Darwin"
typeCheckingMode = "basic"
# Make `app.*` imports resolvable when running the linter from the repo root.
executionEnvironments = [{ root = ".", extraPaths = ["."] }]

[tool.pytest.ini_options]
testpaths = ["tests"]
